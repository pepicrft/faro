name: Faro server

on:
  push:
    branches: [main]
    paths:
      - server/**
      - deploy/**
      - mise.toml
      - mise.lock
      - .github/workflows/server.yml
      - .github/actions/setup-tuist/**
  pull_request:
    paths:
      - server/**
      - deploy/**
      - mise.toml
      - mise.lock
      - .github/workflows/server.yml
      - .github/actions/setup-tuist/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ONCE_CACHE_PROVIDER: ${{ vars.TUIST_CI_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'tuist' || 'local' }}

concurrency:
  group: faro-server-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check server and chart
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: faro
          POSTGRES_PASSWORD: faro-ci-only
          POSTGRES_DB: faro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faro -d faro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FARO_DATABASE_ENABLED: "true"
      FARO_DATABASE_URL: postgres://faro:faro-ci-only@localhost:5432/faro_test
      FARO_TEST_DATABASE_URL: postgres://faro:faro-ci-only@localhost:5432/faro_test
      FARO_DATABASE_SSL: "false"
      FARO_SMOKE_DATABASE_ENABLED: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          working_directory: server
          install_args: github:tuist/once erlang elixir helm
      - uses: ./.github/actions/setup-tuist
        with:
          working-directory: server
      - run: mise run setup
      - run: mise run check
      - name: Smoke-test the release with PostgreSQL
        run: mise run smoke
      - name: Verify release database migrations
        run: >-
          FARO_SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')"
          .once/out/mix_release/release/bin/faro eval 'Faro.Release.migrate()'
      - run: mise run check:helm

  image:
    name: Build server image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate for main-branch publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/pepicrft/faro-server:main
            ghcr.io/pepicrft/faro-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/pepicrft/faro
          cache-from: type=gha,scope=faro-server
          cache-to: type=gha,mode=max,scope=faro-server
