{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.appSecretName }}
  labels:
    {{- include "faro.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.appSecretName }}
    creationPolicy: Owner
    {{- if .Values.postgres.enabled }}
    template:
      engineVersion: v2
      data:
        FARO_SECRET_KEY_BASE: {{ "{{ .FARO_SECRET_KEY_BASE }}" | quote }}
        FARO_DATABASE_URL: {{ printf "ecto://%s:{{ .POSTGRES_PASSWORD | urlquery }}@%s-rw/%s" .Values.postgres.user .Values.postgres.clusterName .Values.postgres.database | quote }}
    {{- end }}
  data:
    - secretKey: FARO_SECRET_KEY_BASE
      remoteRef:
        key: {{ .Values.externalSecrets.secretKeyBaseRemoteKey | quote }}
    {{- if .Values.postgres.enabled }}
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.postgresPasswordRemoteKey | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.appSecretName }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.postgres.appSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.user | quote }}
        password: {{ "{{ .password }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.postgresPasswordRemoteKey | quote }}
    {{- end }}
{{- if .Values.externalSecrets.imagePullSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.imagePullSecret.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalSecrets.imagePullSecret.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ `{{ dict "auths" (dict "ghcr.io" (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson }}` | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.imagePullSecret.usernameRemoteKey | quote }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.imagePullSecret.passwordRemoteKey | quote }}
{{- end }}
{{- end }}
