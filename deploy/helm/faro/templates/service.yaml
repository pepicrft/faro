apiVersion: v1
kind: Service
metadata:
  name: {{ include "faro.fullname" . }}
  labels:
    {{- include "faro.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "faro.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
