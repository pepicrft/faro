fullnameOverride: ""
replicaCount: 1

image:
  repository: ghcr.io/pepicrft/faro-server
  tag: main
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Provision this separately; the chart never generates or embeds a production key.
appSecretName: faro-app-env
env:
  PHX_SERVER: "true"
  PORT: "4000"
  FARO_HOST: localhost
  FARO_DATABASE_ENABLED: "false"

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []

externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  secretKeyBaseRemoteKey: faro/SECRET_KEY_BASE
  postgresPasswordRemoteKey: faro/POSTGRES_PASSWORD
  imagePullSecret:
    enabled: false
    name: ghcr-pull-secret
    usernameRemoteKey: kubernetes/GHCR_PULL_USERNAME
    passwordRemoteKey: kubernetes/GHCR_PULL_TOKEN

# Enable after registering Faro in indie's analytics-projects.yaml. The scaffold
# does not emit analytics events or capture personal-agent content.
analytics:
  enabled: false
  secretName: analytics-client

networkPolicy:
  enabled: true

ingress:
  enabled: false
  className: nginx
  host: faro.fyi
  tlsSecretName: faro-fyi-tls
  annotations: {}

caddy:
  enabled: false
  host: faro.fyi
  email: faro@pepicrft.me
  image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
  storageClass: ""
  storageSize: 2Gi
  serviceAnnotations: {}

postgres:
  enabled: false
  clusterName: faro-postgres
  appSecretName: faro-postgres-app
  database: faro_prod
  user: faro
  image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  instances: 1
  storageClass: ""
  storageSize: 20Gi
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  backup:
    enabled: false
    bucketName: ""
    objectStoreName: faro-postgres-backups
    secretName: faro-postgres-backups
    endpointURL: https://fsn1.your-objectstorage.com
    retentionPolicy: 30d
    schedule: "0 30 2 * * *"
