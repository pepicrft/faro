apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: faro
  # Existing management namespace for the Pepicrft workload cluster.
  namespace: org-salibu
spec:
  # Unsuspend in indie only after publishing an image and provisioning secrets.
  suspend: true
  dependsOn:
    - name: platform
  interval: 10m0s
  maxHistory: 5
  releaseName: faro
  targetNamespace: faro
  storageNamespace: faro
  kubeConfig:
    secretRef:
      name: salibu-production-kubeconfig
  chart:
    spec:
      chart: ./deploy/helm/faro
      interval: 5m0s
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: faro
        namespace: flux-system
      valuesFiles:
        - deploy/helm/faro/values.yaml
        - deploy/values-production.yaml
  install:
    createNamespace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 2m0s
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 2m0s
  timeout: 10m0s
  values:
    image:
      repository: ghcr.io/pepicrft/faro-server # {"$imagepolicy": "flux-system:faro-server:name"}
      tag: main # {"$imagepolicy": "flux-system:faro-server:tag"}
      digest: "" # {"$imagepolicy": "flux-system:faro-server:digest"}
