# Faro's native graph follows atlas-native: explicit cross-language targets,
# Cargo for editor tooling, and no generated Xcode or Gradle project.
[workspace]
include = ["once.toml", "desktop/once.toml"]
exclude = ["**/Cargo.toml"]

# Local caching works on fresh clones and forks without an account or secrets.
[infrastructure.cache]
provider = "local"

[infrastructures.local]
kind = "local"

[[target]]
name = "FaroDesktopDependencies"
kind = "cargo_dependencies"
[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
packages = ["gpui"]
# Once 0.68.2 requires source materialization before graph loading.
vendor_dir = ".once/vendor"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml", "cli/Cargo.toml", "desktop/Cargo.toml"]

[[target]]
name = "FaroCore"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]
[target.attrs]
crate_name = "faro_core"
crate_root = "core/src/lib.rs"
edition = "2024"

[[target]]
name = "FaroCoreTests"
kind = "rust_test"
srcs = ["core/src/**/*.rs"]
[target.attrs]
crate_name = "faro_core_tests"
crate_root = "core/src/lib.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "FaroCLI"
kind = "rust_binary"
srcs = ["cli/src/**/*.rs"]
deps = ["./FaroCore"]
[target.attrs]
crate_name = "faro"
crate_root = "cli/src/main.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "FaroCLITests"
kind = "rust_test"
srcs = ["cli/src/**/*.rs"]
deps = ["./FaroCore"]
[target.attrs]
crate_name = "faro_cli_tests"
crate_root = "cli/src/main.rs"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "FaroCoreFFI"
kind = "apple_system_module"
[target.attrs]
modulemap = "core/include/module.modulemap"
headers = ["core/include/faro_core.h"]
header_dirs = ["core/include"]

[[target]]
name = "FaroMacCore"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]
[target.attrs]
crate_name = "faro_core"
crate_root = "core/src/lib.rs"
edition = "2024"
crate_type = "staticlib"

[[target]]
name = "FaroMobileCore"
kind = "rust_mobile_library"
srcs = ["core/src/**/*.rs"]
[target.attrs]
crate_name = "faro_core"
crate_root = "core/src/lib.rs"
edition = "2024"
apple_target = "aarch64-apple-ios-sim"
android_target = "aarch64-linux-android"
android_abi = "arm64-v8a"
android_api = 26

[[target]]
name = "FaroDeviceCore"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]
[target.attrs]
crate_name = "faro_core"
crate_root = "core/src/lib.rs"
edition = "2024"
target = "aarch64-apple-ios"
crate_type = "staticlib"

[[target]]
name = "FaroMac"
kind = "apple_application"
srcs = ["apple/Sources/**/*.swift"]
deps = ["./FaroMacCore", "./FaroCoreFFI"]
[target.attrs]
platform = "macos"
bundle_id = "io.github.pepicrft.faro"
product_name = "Faro"
minimum_os = "14.0"

[[target]]
name = "FaroMacTests"
kind = "apple_test_bundle"
srcs = ["apple/Tests/**/*.swift", "apple/Sources/FaroCore.swift"]
deps = ["./FaroMacCore", "./FaroCoreFFI"]
[target.attrs]
platform = "macos"
bundle_id = "io.github.pepicrft.faro.tests"
minimum_os = "14.0"
swift_testing = true

[[target]]
name = "FaroIOS"
kind = "apple_application"
srcs = ["apple/Sources/**/*.swift"]
deps = ["./FaroMobileCore", "./FaroCoreFFI"]
[target.attrs]
platform = "ios"
sdk_variant = "simulator"
bundle_id = "io.github.pepicrft.faro"
product_name = "Faro"
minimum_os = "17.0"
families = ["iphone", "ipad"]
info_plist = "apple/iOS-Info.plist"
info_plist_substitutions = { FARO_SUPPORTED_PLATFORM = "iPhoneSimulator", FARO_PLATFORM_NAME = "iphonesimulator" }

[[target]]
name = "FaroIOSTests"
kind = "apple_test_bundle"
srcs = ["apple/Tests/**/*.swift", "apple/Sources/FaroCore.swift"]
deps = ["./FaroMobileCore", "./FaroCoreFFI"]
[target.attrs]
platform = "ios"
sdk_variant = "simulator"
bundle_id = "io.github.pepicrft.faro.tests"
minimum_os = "17.0"
swift_testing = true

[[target]]
name = "FaroIOSDevice"
kind = "apple_application"
srcs = ["apple/Sources/**/*.swift"]
deps = ["./FaroDeviceCore", "./FaroCoreFFI"]
[target.attrs]
platform = "ios"
sdk_variant = "device"
bundle_id = "io.github.pepicrft.faro"
product_name = "Faro"
minimum_os = "17.0"
families = ["iphone", "ipad"]
info_plist = "apple/iOS-Info.plist"
info_plist_substitutions = { FARO_SUPPORTED_PLATFORM = "iPhoneOS", FARO_PLATFORM_NAME = "iphoneos" }

[[target]]
name = "FaroAndroid"
kind = "android_binary"
srcs = ["android/src/**/*.kt"]
deps = ["./FaroMobileCore"]
[target.attrs]
application_id = "io.github.pepicrft.faro"
manifest = "android/AndroidManifest.xml"
resource_dirs = ["android/res"]
resource_files = ["android/res/**"]
compile_sdk = 35
target_sdk_version = 35
min_sdk_version = 26
build_tools_version = "35.0.0"
version_code = 1
version_name = "0.1.0"
launch_activity = ".MainActivity"
signing = "debug"
debug_keystore = ".once/debug.keystore"
